<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aishwarya | Engineering & Security</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lenis@1/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
</head>

<body>

    <!-- Prevent white flash: apply dark mode before paint -->
    <script>
        if (localStorage.getItem('theme') !== 'light') document.body.classList.add('dark-mode');
    </script>

    <canvas id="renders-gl-canvas"></canvas>

    <!-- Header: rendered dynamically from js/data.js -->
    <header class="title-bar"></header>

    <div id="main-content" class="container">
    </div>

    <!-- Mobile nav: rendered dynamically from js/data.js -->
    <nav class="mobile-nav"></nav>

    <!-- Theme toggle -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <i class="fas fa-sun"></i>
    </button>

    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/renders-webgl.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
